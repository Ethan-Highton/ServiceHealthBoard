<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0e0c">
  <title>Service Health</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0e0c'/%3E%3Cpath d='M5 10h22M5 16h22M5 22h22' stroke='%233d3e37'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%234fd0a5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/backlink.js" defer></script>
  <script src="js/app.js" type="module" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Service Health</div>
    <div class="clock" id="clock" role="timer" aria-label="Current time"></div>
  </header>

  <main>
    <h1>Services</h1>
    <p id="summary" class="line" aria-live="polite">Checking…</p>

    <div class="board">
      <div class="board__head"><span>Service</span><span>Status</span></div>
      <ul id="list" class="list" aria-label="Services"></ul>
    </div>

    <p class="updated"><span id="updated"></span> <button id="refresh" class="ghost" type="button">Refresh now</button></p>
  </main>

  <dialog id="confirm">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="actions">
        <button value="cancel" class="ghost">Cancel</button>
        <button value="ok" class="primary">Restart</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
